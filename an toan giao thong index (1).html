<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#172b27">
<meta name="description" content="Bài thuyết trình tương tác: An toàn giao thông">
<title>An toàn giao thông — Bài thuyết trình</title>
<style>
:root{color-scheme:dark;--ink:#f7fbfa;--muted:#b8c8c4;--accent:#ff7a35;--panel:#10201f}
*{box-sizing:border-box}
html,body{margin:0;width:100%;min-height:100%;background:#101a1b;color:var(--ink);font-family:system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif}
body{overflow:hidden}
button{font:inherit}
#app{height:100dvh;min-height:100svh;display:flex;flex-direction:column;background:radial-gradient(ellipse at 50% 0%,#263c39 0%,#101a1b 65%)}
.topbar{height:54px;flex:none;display:flex;align-items:center;justify-content:space-between;padding:0 clamp(12px,3vw,34px);gap:12px}
.brand{font-size:12px;letter-spacing:.14em;text-transform:uppercase;font-weight:800;color:#d9e6e2}
.top-actions{display:flex;align-items:center;gap:8px}
.icon-btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-width:40px;height:38px;padding:0 12px;border:1px solid #52635f;border-radius:12px;background:#1d2d2b;color:#fff;cursor:pointer;transition:background .2s,transform .2s,border-color .2s}
.icon-btn:hover{background:#304440;border-color:#9aada7}
.icon-btn:active{transform:scale(.96)}
.icon-btn:focus-visible,.stage:focus-visible,.intro:focus-visible{outline:3px solid #ffca28;outline-offset:3px}
.stage-wrap{flex:1;min-height:0;display:flex;align-items:center;justify-content:center;padding:8px clamp(8px,2vw,26px) 12px}
.stage{position:relative;width:min(100%,calc((100dvh - 140px)*16/9));aspect-ratio:16/9;max-height:100%;overflow:hidden;border-radius:clamp(8px,1.3vw,18px);background:#d2d8d9;box-shadow:0 24px 70px #0008,0 0 0 1px #ffffff20;cursor:pointer;isolation:isolate;touch-action:manipulation}
.slide-img{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;display:block;user-select:none;-webkit-user-drag:none;pointer-events:none}
.slide-img.enter{animation:fadeIn .58s cubic-bezier(.2,.7,.2,1) both}
.slide-img.fx-0.enter{animation:zoomIn .72s cubic-bezier(.2,.8,.2,1) both}
.slide-img.fx-1.enter{animation:slideIn .62s cubic-bezier(.2,.7,.2,1) both}
.slide-img.fx-2.enter{animation:fadeIn .72s ease both}
.slide-img.fx-3.enter{animation:riseIn .68s cubic-bezier(.2,.8,.2,1) both}
.slide-img.fx-4.enter{animation:zoomIn .62s cubic-bezier(.2,.8,.2,1) both}
.slide-img.fx-5.enter{animation:slideIn .72s cubic-bezier(.2,.7,.2,1) both}
.slide-img.fx-6.enter{animation:fadeIn .6s ease both}
.slide-img.fx-7.enter{animation:riseIn .65s cubic-bezier(.2,.8,.2,1) both}
.slide-img.fx-8.enter{animation:zoomIn .68s cubic-bezier(.2,.8,.2,1) both}
.slide-img.fx-9.enter{animation:fadeIn .78s ease both}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
@keyframes zoomIn{from{opacity:0;transform:scale(1.045)}to{opacity:1;transform:scale(1)}}
@keyframes slideIn{from{opacity:0;transform:translateX(3.5%)}to{opacity:1;transform:translateX(0)}}
@keyframes riseIn{from{opacity:0;transform:translateY(3.5%)}to{opacity:1;transform:translateY(0)}}
.footer{flex:none;padding:0 clamp(12px,3vw,34px) max(10px,env(safe-area-inset-bottom));}
.progress-track{height:4px;border-radius:99px;background:#394744;overflow:hidden;margin:0 0 10px}
.progress-fill{height:100%;width:10%;background:linear-gradient(90deg,#ff7a35,#ffcc36);border-radius:99px;transition:width .38s ease}
.controls{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:12px;min-height:40px}
.hint{font-size:12px;color:var(--muted);white-space:nowrap}
.counter{font-variant-numeric:tabular-nums;font-weight:800;letter-spacing:.06em;font-size:14px}
.nav-group{display:flex;gap:8px;justify-self:end}
#prevBtn:disabled,#nextBtn:disabled{opacity:.38;cursor:not-allowed}
.intro{position:fixed;inset:0;z-index:10;display:flex;align-items:center;justify-content:center;overflow:hidden;cursor:pointer;background:linear-gradient(135deg,#d7e1df 0%,#b7c9c5 48%,#e6ece9 100%);color:#20332f;transition:opacity .7s ease,transform .7s ease;touch-action:manipulation}
.intro.hidden{opacity:0;transform:scale(1.045);pointer-events:none}.intro[hidden]{display:none!important}
.intro::before{content:"";position:absolute;width:130vmax;height:130vmax;border-radius:50%;background:repeating-conic-gradient(from 0deg,#f8faf8 0deg 10deg,#e7efec 10deg 20deg);opacity:.25;animation:orbit 80s linear infinite}
.intro-road{position:absolute;width:125%;height:28%;left:-12%;bottom:5%;background:#283432;transform:rotate(-9deg);border-block:8px solid #f7f5e9;box-shadow:0 0 0 2px #283432;animation:roadDrift 6s ease-in-out infinite alternate}
.intro-road::after{content:"";position:absolute;left:0;right:0;top:50%;border-top:5px dashed #ffd23f}
.intro-content{position:relative;z-index:2;text-align:center;padding:28px;max-width:760px;width:100%}
.kicker{font-size:clamp(11px,1.6vw,15px);font-weight:900;letter-spacing:.28em;text-transform:uppercase;color:#b84b1a;margin-bottom:12px}
.intro h1{font-size:clamp(42px,9vw,104px);line-height:.92;letter-spacing:-.055em;margin:0;text-transform:uppercase;color:#1d493b;text-shadow:0 3px 0 #ffffff80}
.intro h1 span{display:block;color:#f0782f}
.intro-sub{margin:20px auto 0;max-width:500px;font-size:clamp(13px,2vw,18px);line-height:1.5;color:#354b45}
.tap-prompt{display:inline-flex;align-items:center;gap:10px;margin-top:28px;padding:13px 20px;border-radius:999px;background:#203c33;color:white;font-size:14px;font-weight:750;box-shadow:0 8px 22px #172e2830;animation:pulse 2s ease-in-out infinite}
.tap-dot{width:8px;height:8px;border-radius:50%;background:#ffd23f;box-shadow:0 0 0 5px #ffd23f28}
.traffic-light{position:absolute;z-index:1;right:clamp(7%,calc((100vw - 900px)*.12 + 7%),17%);top:12%;width:clamp(62px,10vw,110px);padding:10px 9px;border-radius:18px;background:#18221f;box-shadow:0 18px 35px #172d2835;transform-origin:50% 90%;animation:sway 4.5s ease-in-out infinite}
.traffic-light::before{content:"";position:absolute;width:9px;height:16vh;min-height:60px;left:calc(50% - 4.5px);top:100%;background:#34443f;z-index:-1}
.lamp{display:block;width:clamp(19px,3.5vw,34px);aspect-ratio:1;border-radius:50%;margin:5px auto;box-shadow:inset 0 -3px 5px #0004}
.lamp.red{background:#ff424b}.lamp.yellow{background:#ffd23f}.lamp.green{background:#43c979}
.helmet{position:absolute;left:clamp(5%,calc((100vw - 900px)*.12 + 7%),17%);top:19%;width:clamp(90px,15vw,165px);height:clamp(60px,10vw,110px);border-radius:70% 70% 30% 35%;background:#ffbd36;border:5px solid #fff9d7;box-shadow:0 14px 30px #182c2730;transform:rotate(-12deg);animation:helmetBob 3.8s ease-in-out infinite}
.helmet::before{content:"";position:absolute;left:12%;right:-9%;bottom:5%;height:14px;border-radius:3px 18px 10px 10px;background:#e9772e;border:3px solid #fff9d7}
.helmet::after{content:"";position:absolute;left:35%;top:12%;width:35%;height:30%;border-radius:100% 0 0 0;border-top:5px solid #fff8d2;transform:rotate(-25deg)}
@keyframes sway{0%,100%{transform:rotate(-5deg)}50%{transform:rotate(5deg)}}
@keyframes helmetBob{0%,100%{transform:translateY(0) rotate(-12deg)}50%{transform:translateY(-10px) rotate(-6deg)}}
@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.035)}}
@keyframes orbit{to{transform:rotate(360deg)}}
@keyframes roadDrift{from{transform:rotate(-9deg) translateX(-1%)}to{transform:rotate(-9deg) translateX(1%)}}
@media(max-width:600px){
 .topbar{height:44px}.brand{font-size:10px;letter-spacing:.08em}
 .stage-wrap{padding:4px 5px 8px}
 .stage{width:100%;max-height:calc(100dvh - 130px);border-radius:7px}
 .footer{padding-left:10px;padding-right:10px}
 .hint{font-size:10px;white-space:normal;max-width:100px}
 .icon-btn{height:36px;min-width:36px;padding:0 9px;border-radius:10px}
 .controls{gap:6px}
 .traffic-light{top:10%;right:8%}
 .helmet{top:17%;left:7%}
 .intro-sub{max-width:300px}
}
@media(prefers-reduced-motion:reduce){
 *,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;scroll-behavior:auto!important;transition-duration:.01ms!important}
}
</style>
</head>
<body>
<div id="app">
  <header class="topbar">
    <div class="brand">An toàn giao thông</div>
    <div class="top-actions">
      <button class="icon-btn" id="fullscreenBtn" type="button" aria-label="Bật hoặc tắt toàn màn hình" title="Toàn màn hình (F)">⛶ <span class="fs-label">Toàn màn hình</span></button>
    </div>
  </header>
  <main class="stage-wrap">
    <section id="stage" class="stage" tabindex="0" role="button" aria-label="Nhấn để chuyển sang slide tiếp theo">
      <img id="slideImage" class="slide-img enter fx-0" alt="Slide 01 trong bài thuyết trình An toàn giao thông" draggable="false">
    </section>
  </main>
  <footer class="footer">
    <div class="progress-track" role="progressbar" aria-label="Tiến trình bài thuyết trình" aria-valuemin="0" aria-valuemax="10" aria-valuenow="1" id="progressBar"><div class="progress-fill" id="progressFill"></div></div>
    <div class="controls">
      <div class="hint" id="hint">Nhấn vào slide để tiếp tục · ← →</div>
      <div class="counter" id="counter" aria-live="polite">01/10</div>
      <div class="nav-group">
        <button class="icon-btn" id="prevBtn" type="button" aria-label="Slide trước" title="Slide trước (←)">← <span class="nav-label">Trước</span></button>
        <button class="icon-btn" id="nextBtn" type="button" aria-label="Slide tiếp theo" title="Slide tiếp theo (→)">Tiếp <span aria-hidden="true">→</span></button>
      </div>
    </div>
  </footer>
</div>
<section id="intro" class="intro" role="button" tabindex="0" aria-label="Nhấn để bắt đầu bài thuyết trình">
  <div class="intro-road" aria-hidden="true"></div>
  <div class="helmet" aria-hidden="true"></div>
  <div class="traffic-light" aria-hidden="true"><i class="lamp red"></i><i class="lamp yellow"></i><i class="lamp green"></i></div>
  <div class="intro-content">
    <div class="kicker">Bài thuyết trình</div>
    <h1>An toàn <span>giao thông</span></h1>
    <p class="intro-sub">Cùng nâng cao ý thức, tuân thủ luật giao thông và xây dựng những hành trình an toàn mỗi ngày.</p>
    <div class="tap-prompt"><span class="tap-dot"></span> Nhấn hoặc chạm để bắt đầu</div>
  </div>
</section>

const stage = document.getElementById('stage');
const image = document.getElementById('slideImage');
const intro = document.getElementById('intro');
const counter = document.getElementById('counter');
const progressFill = document.getElementById('progressFill');
const progressBar = document.getElementById('progressBar');
const prevBtn = document.getElementById('prevBtn');
const nextBtn = document.getElementById('nextBtn');
const fullscreenBtn = document.getElementById('fullscreenBtn');
const hint = document.getElementById('hint');
let current = 0;
let started = false;
let isTransitioning = false;

function renderSlide(index) {
  if (index < 0 || index >= slides.length || isTransitioning) return;
  current = index;
  isTransitioning = true;
  image.className = 'slide-img';
  // Force a reflow so each navigation retriggers the selected transition.
  void image.offsetWidth;
  image.src = slides[current];
  image.alt = `Slide ${String(current + 1).padStart(2, '0')} trong bài thuyết trình An toàn giao thông`;
  image.className = `slide-img enter fx-${current}`;
  counter.textContent = `${String(current + 1).padStart(2, '0')}/${String(slides.length).padStart(2, '0')}`;
  progressFill.style.width = `${((current + 1) / slides.length) * 100}%`;
  progressBar.setAttribute('aria-valuenow', String(current + 1));
  prevBtn.disabled = current === 0;
  nextBtn.disabled = current === slides.length - 1;
  hint.textContent = current === slides.length - 1 ? 'Đã đến slide cuối · ← để quay lại' : 'Nhấn vào slide để tiếp tục · ← →';
  window.setTimeout(() => { isTransitioning = false; }, 800);
}
function startPresentation() {
  if (started) return;
  started = true;
  intro.classList.add('hidden');
  window.setTimeout(() => { intro.hidden = true; }, 750);
  renderSlide(0);
}
function nextSlide() { if (!started) { startPresentation(); return; } if (current < slides.length - 1) renderSlide(current + 1); }
function previousSlide() { if (started && current > 0) renderSlide(current - 1); }

intro.addEventListener('click', startPresentation);
intro.addEventListener('keydown', event => {
  if (event.key === 'Enter' || event.key === ' ') { event.preventDefault(); startPresentation(); }
});
stage.addEventListener('click', () => { if (started) nextSlide(); });
stage.addEventListener('keydown', event => {
  if (event.key === 'Enter' || event.key === ' ') { event.preventDefault(); nextSlide(); }
});
prevBtn.addEventListener('click', event => { event.stopPropagation(); previousSlide(); });
nextBtn.addEventListener('click', event => { event.stopPropagation(); nextSlide(); });
fullscreenBtn.addEventListener('click', async event => {
  event.stopPropagation();
  try {
    if (!document.fullscreenElement) await document.documentElement.requestFullscreen();
    else await document.exitFullscreen();
  } catch (error) {
    hint.textContent = 'Trình duyệt không cho phép bật toàn màn hình tại thời điểm này.';
  }
});
document.addEventListener('keydown', event => {
  if (event.key === 'Escape') {
    if (document.fullscreenElement) document.exitFullscreen().catch(() => {});
    return;
  }
  if (!started) {
    if (['ArrowRight','ArrowDown','PageDown','Enter',' '].includes(event.key)) { event.preventDefault(); startPresentation(); }
    return;
  }
  if (['ArrowRight','ArrowDown','PageDown',' '].includes(event.key)) { event.preventDefault(); nextSlide(); }
  else if (['ArrowLeft','ArrowUp','PageUp'].includes(event.key)) { event.preventDefault(); previousSlide(); }
  else if (event.key.toLowerCase() === 'f') fullscreenBtn.click();
});
document.addEventListener('fullscreenchange', () => {
  fullscreenBtn.innerHTML = document.fullscreenElement ? '⛶ <span class="fs-label">Thoát toàn màn hình</span>' : '⛶ <span class="fs-label">Toàn màn hình</span>';
});
// Do not auto-advance: the first slide remains until the viewer interacts.
image.src = slides[0];
renderSlide(0);
</script>
